<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGAL SIGNATURE | WELL DONE</title>
    <style>
        body { background-color: #000; color: #ffd700; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; border: 2px solid #ffd700; padding: 20px; }
        canvas { border: 2px dashed #ffd700; background: #fff; cursor: crosshair; width: 100%; max-width: 500px; height: 200px; }
        button { width: 100%; padding: 15px; margin-top: 20px; background: #ffd700; color: #000; font-weight: bold; border: none; cursor: pointer; }
        .clear-btn { background: #444; color: #fff; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ON-CALL EMPLOYEE AGREEMENT</h2>
        <p>Sign below to execute your W-2 At-Will Agreement.</p>
        <canvas id="sig-canvas"></canvas>
        <button id="submit-btn">EXECUTE & SAVE AGREEMENT</button>
        <button class="clear-btn" id="clear-btn">CLEAR PAD</button>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzL7I6U1-k6iKNo6-p_0S-k7oF8_TwoKS9RQ_M5/exec';
        const canvas = document.getElementById('sig-canvas');
        const ctx = canvas.getContext('2d');
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');

        // Signature Logic
        let drawing = false;
        canvas.addEventListener('mousedown', () => drawing = true);
        window.addEventListener('mouseup', () => drawing = false);
        canvas.addEventListener('mousemove', draw);

        function draw(e) {
            if (!drawing) return;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000';
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        document.getElementById('clear-btn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
        });

        document.getElementById('submit-btn').addEventListener('click', () => {
            const btn = document.getElementById('submit-btn');
            btn.innerText = "UPLOADING TO VAULT...";
            btn.disabled = true;

            const data = {
                action: 'saveSignature',
                email: email,
                signatureData: canvas.toDataURL().split(',')[1],
                fileName: "Executed_Agreement_" + email + ".png"
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            }).then(() => {
                // Redirect to root onboarding page
                window.location.href = "/onboarding.html?email=" + encodeURIComponent(email);
            });
        });
    </script>
</body>
</html>
