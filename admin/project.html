<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://welldoneconstruction.link/wp-content/uploads/2025/11/well-done-construction-favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatch Work Order | Well Done</title>
    <style>
        :root { --primary: #343E47; --accent: #33B26E; --bg: #f4f7f6; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); padding: 40px; color: var(--primary); }
        .form-card { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-transform: uppercase; letter-spacing: 1px; margin-top: 0; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; color: #6E797F; text-transform: uppercase; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .worker-tag { background: #e8f5e9; color: var(--accent); padding: 5px 10px; border-radius: 4px; font-weight: bold; }
        button { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>Dispatch Mission</h2>
        <p style="font-size: 0.9rem; margin-bottom: 25px;">Assigning mission to: <span class="worker-tag" id="workerEmail"></span></p>
        
        <label>Job Address (Triggers Ancestry ID)</label>
        <input type="text" id="address" placeholder="e.g. 123 Brown St" required>

        <label>Mission Pay (USD)</label>
        <input type="number" id="missionPay" placeholder="500">

        <label>Scope of Work / Notes</label>
        <textarea id="notes" rows="4" placeholder="Detailed instructions for the worker..."></textarea>
        
        <button onclick="sendOffer()" id="btn">SEND OFFICIAL OFFER</button>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzgDKD-WxUrdxIPzyNOQ1Re00tZG23RHaiD0FLzs6Lv07YK916vPEMVx3ivYi9IhYKd/exec';
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('prefillEmail');
        document.getElementById('workerEmail').innerText = email;

        async function sendOffer() {
            const btn = document.getElementById('btn');
            const address = document.getElementById('address').value;
            
            if(!address) return alert("Address is required to generate JOB ID.");
            
            btn.disabled = true;
            btn.innerText = "GENERATING ANCESTRY ID & SENDING...";

            const payload = {
                action: 'dispatchJob',
                email: email,
                address: address,
                missionPay: document.getElementById('missionPay').value,
                notes: document.getElementById('notes').value
            };

            try {
                await fetch(scriptURL, { 
                    method: 'POST', 
                    mode: 'no-cors',
                    body: JSON.stringify(payload) 
                });
                alert("Mission Dispatched. Worker notified.");
                window.location.href = "index.html"; // Returns to Admin Dashboard
            } catch (e) {
                alert("Error dispatching. Check connection.");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
