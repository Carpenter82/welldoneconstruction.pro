<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:40px;">
    <div style="max-width:500px; margin:auto; background:white; padding:20px; border:2px solid #ef6c00;">
        <h2>Dispatch Work Order</h2>
        <label>Worker: <b id="workerEmail"></b></label><br><br>
        
        <label>Address:</label><input type="text" id="address" style="width:100%"><br><br>
        <label>Mission Pay ($):</label><input type="number" id="missionPay" style="width:100%"><br><br>
        <label>Scope:</label><textarea id="notes" style="width:100%"></textarea><br><br>
        
        <button onclick="send()" id="btn" style="width:100%; padding:15px; background:#ef6c00; color:white;">SEND OFFER</button>
    </div>

    <script>
        const scriptURL = 'YOUR_DEPLOYED_URL_HERE';
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('prefillEmail');
        document.getElementById('workerEmail').innerText = email;

        async function send() {
            document.getElementById('btn').disabled = true;
            const payload = {
                action: 'dispatchJob',
                email: email,
                address: document.getElementById('address').value,
                missionPay: document.getElementById('missionPay').value,
                notes: document.getElementById('notes').value,
                client: "Manual Entry"
            };
            await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) });
            alert("Offer Sent!");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
