<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://welldoneconstruction.link/wp-content/uploads/2025/11/well-done-construction-favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Command Center | Well Done ERP</title>
    <style>
        :root { --primary: #343E47; --accent: #33B26E; --bg: #f4f7f6; --white: #ffffff; --danger: #e74c3c; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); padding: 20px; color: var(--primary); margin: 0; }
        
        /* Layout */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 1200px; margin: auto; }
        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }
        
        /* Cards */
        .card { background: var(--white); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-transform: uppercase; letter-spacing: 1px; margin-top: 0; border-bottom: 2px solid var(--accent); padding-bottom: 15px; font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center; }
        .card-sub { font-size: 0.85rem; color: #7f8c8d; margin-bottom: 20px; }

        /* Forms */
        label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.8rem; color: #6E797F; text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #dcdfe6; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; transition: 0.2s; }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; }

        /* Buttons */
        .btn-main { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .btn-main:hover { background: #2c353d; }
        .btn-success { background: var(--accent); }
        .btn-success:hover { background: #28965a; }
        
        /* Dispatch Tabs */
        .tab-container { display: flex; margin-bottom: 20px; background: #eee; border-radius: 6px; padding: 4px; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; border-radius: 4px; font-weight: 600; font-size: 0.9rem; }
        .tab.active { background: white; shadow: 0 2px 5px rgba(0,0,0,0.1); color: var(--accent); }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="dashboard-grid">
        
        <div class="card">
            <h2>1. New Project Entry</h2>
            <p class="card-sub">Create ancestry records in ProjectLog.</p>
            
            <form id="projectForm">
                <label>Client Name</label>
                <input type="text" id="clientName" placeholder="e.g. John Doe" required>

                <label>Street Address (Generates Job ID)</label>
                <input type="text" id="streetAddress" placeholder="e.g. 123 Brown St" required>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>Est. Budget ($)</label>
                        <input type="number" id="budget" placeholder="0.00">
                    </div>
                    <div>
                        <label>Lead Source</label>
                        <select id="source">
                            <option value="Referral">Referral</option>
                            <option value="Website">Website</option>
                            <option value="Repeat">Repeat Client</option>
                        </select>
                    </div>
                </div>

                <label>Project Notes / Scope</label>
                <textarea id="projectNotes" rows="3" placeholder="Initial scope of work..."></textarea>

                <button type="button" class="btn-main" onclick="submitProject()" id="btnSaveProject">
                    Save to Database
                </button>
            </form>
        </div>

        <div class="card">
            <h2>2. Dispatch Center</h2>
            <p class="card-sub">Search, Select, and Deploy resources.</p>

            <label>Select Job (Search by ID or Address)</label>
            <input type="text" id="dispatchJobId" placeholder="Type to search active jobs..." list="activeJobsList">
            <datalist id="activeJobsList">
                </datalist>

            <div class="tab-container">
                <div class="tab active" onclick="switchTab('direct')">Option A: Direct Request</div>
                <div class="tab" onclick="switchTab('board')">Option B: Open Board</div>
            </div>

            <div id="panel-direct">
                <label>Select Worker</label>
                <input type="email" id="workerEmail" placeholder="Search Crew Email..." list="crewList">
                <datalist id="crewList">
                    </datalist>

                <label>Manual Trade Note</label>
                <textarea id="directNote" rows="3" placeholder="Specific instructions for this worker..."></textarea>
                
                <button type="button" class="btn-main" onclick="sendDirectRequest()" id="btnDirect">
                    Send "Yes/No" Request
                </button>
            </div>

            <div id="panel-board" class="hidden">
                <label>Posting Pay Rate ($)</label>
                <input type="number" id="boardPay" placeholder="Standard Rate">

                <label>Board Description</label>
                <textarea id="boardNote" rows="3" placeholder="Description for the public board..."></textarea>

                <button type="button" class="btn-main btn-success" onclick="postToBoard()" id="btnBoard">
                    Post to Open Board
                </button>
            </div>

        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzgDKD-WxUrdxIPzyNOQ1Re00tZG23RHaiD0FLzs6Lv07YK916vPEMVx3ivYi9IhYKd/exec';

        // --- UI LOGIC ---
        function switchTab(mode) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(mode === 'direct') {
                document.querySelector('.tab-container .tab:nth-child(1)').classList.add('active');
                document.getElementById('panel-direct').classList.remove('hidden');
                document.getElementById('panel-board').classList.add('hidden');
            } else {
                document.querySelector('.tab-container .tab:nth-child(2)').classList.add('active');
                document.getElementById('panel-direct').classList.add('hidden');
                document.getElementById('panel-board').classList.remove('hidden');
            }
        }

        // --- API CALLS ---

        async function submitProject() {
            const btn = document.getElementById('btnSaveProject');
            btn.disabled = true; btn.innerText = "Generating Ancestry ID...";

            const payload = {
                action: 'createProjectLog',
                client: document.getElementById('clientName').value,
                address: document.getElementById('streetAddress').value,
                budget: document.getElementById('budget').value,
                source: document.getElementById('source').value,
                notes: document.getElementById('projectNotes').value
            };

            sendData(payload, btn, "Save to Database");
        }

        async function sendDirectRequest() {
            const btn = document.getElementById('btnDirect');
            const jobId = document.getElementById('dispatchJobId').value;
            const worker = document.getElementById('workerEmail').value;

            if(!jobId || !worker) return alert("Please select a Job and a Worker.");

            btn.disabled = true; btn.innerText = "Dispatching...";
            
            const payload = {
                action: 'dispatchDirect',
                jobId: jobId,
                email: worker,
                note: document.getElementById('directNote').value
            };

            sendData(payload, btn, "Send 'Yes/No' Request");
        }

        async function postToBoard() {
            const btn = document.getElementById('btnBoard');
            const jobId = document.getElementById('dispatchJobId').value;
            
            if(!jobId) return alert("Please select a Job.");

            btn.disabled = true; btn.innerText = "Posting...";

            const payload = {
                action: 'postToOpenBoard',
                jobId: jobId,
                pay: document.getElementById('boardPay').value,
                note: document.getElementById('boardNote').value
            };

            sendData(payload, btn, "Post to Open Board");
        }

        // --- GENERIC SENDER ---
        async function sendData(data, btnElement, originalText) {
            try {
                await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify(data) 
                });
                alert("Action Successful!");
                // Optional: Clear forms here
            } catch (e) {
                console.error(e);
                alert("Error connecting to Master Engine.");
            } finally {
                btnElement.disabled = false;
                btnElement.innerText = originalText;
            }
        }

        // Pre-fill logic if URL params exist (Legacy support)
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('prefillEmail')) {
            document.getElementById('workerEmail').value = urlParams.get('prefillEmail');
        }
    </script>
</body>
</html>
