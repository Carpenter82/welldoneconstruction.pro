<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center | Well Done</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root { --accent: #ef6c00; --primary: #2e7d32; --dark: #343E47; --docs-ready: #e8f5e9; }
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; padding: 20px; color: var(--dark); }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; border-left: 6px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .ready-card { border-left-color: var(--primary); background-color: var(--docs-ready); }
        .roster-card { border-left-color: var(--dark); }
        .badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; display: inline-block; margin-bottom: 10px; }
        .status-new { background: #fff3e0; color: #e65100; }
        .status-docs { background: var(--primary); color: white; }
        .btn-action { border:none; padding:10px 15px; border-radius:4px; cursor:pointer; color:white; font-size: 13px; font-weight:bold; margin-top:10px; transition: 0.2s; }
        @media (max-width: 850px) { .grid-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div style="max-width: 1200px; margin: 0 auto;">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h1>Admin Command Center</h1>
        <div style="display: flex; gap: 10px;">
            <button onclick="loadDashboard()" class="btn-action" style="background: var(--dark);">Refresh Data</button>
            <a href="activity.html" class="btn-action" style="background: var(--dark); text-decoration: none;">Activity Logs</a>
        </div>
    </header>

    <div class="grid-container">
        <section>
            <h2 style="border-bottom: 3px solid var(--accent); padding-bottom: 5px;">Hiring Pipeline</h2>
            <div id="applicantList">Syncing with Google Sheets...</div>
        </section>

        <section>
            <h2 style="border-bottom: 3px solid var(--dark); padding-bottom: 5px;">Active Roster</h2>
            <div id="crewList">Loading Crew...</div>
        </section>
    </div>
</div>

<script>
    // ✅ ENSURE THIS MATCHES YOUR DEPLOYMENT URL
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzgDKD-WxUrdxIPzyNOQ1Re00tZG23RHaiD0FLzs6Lv07YK916vPEMVx3ivYi9IhYKd/exec';

    async function loadDashboard() {
        try {
            const response = await fetch(scriptURL + "?action=getDashboard");
            const data = await response.json();
            renderApplicants(data.applicants);
            renderCrew(data.activeCrew);
        } catch (err) {
            document.getElementById('applicantList').innerHTML = "Connection Error. Check Script Deployment.";
        }
    }

    function renderApplicants(applicants) {
        const container = document.getElementById('applicantList');
        if (!applicants?.length) { container.innerHTML = "<p>No pending applications.</p>"; return; }

        container.innerHTML = applicants.map(a => {
            const isReady = a.status === "DOCS UPLOADED";
            const cardClass = isReady ? "card ready-card" : "card";
            const badgeClass = isReady ? "status-docs" : "status-new";
            const actionBtn = isReady 
                ? `<button onclick="finalizeHire('${a.email}')" class="btn-action" style="background:var(--primary);">Finalize & Activate</button>`
                : `<button onclick="startOnboarding('${a.email}')" class="btn-action" style="background:var(--accent);">Send Paperwork</button>`;

            return `
                <div class="${cardClass}">
                    <span class="badge ${badgeClass}">${a.status}</span>
                    <h3 style="margin: 0;">${a.name}</h3>
                    <p style="font-size: 14px; margin: 5px 0;">🔧 ${a.trade} | 📞 ${a.phone}</p>
                    <p style="font-size: 12px; color: #666;">${a.email}</p>
                    ${actionBtn}
                </div>`;
        }).join('');
    }

    function renderCrew(crew) {
        const container = document.getElementById('crewList');
        if (!crew?.length) { container.innerHTML = "<p>No active crew.</p>"; return; }

        container.innerHTML = crew.map(c => `
            <div class="card roster-card">
                <h3 style="margin: 0;">${c.name}</h3>
                <p style="font-size: 13px; color: #666;">${c.trade} | ${c.tier}</p>
                <div style="display: flex; gap: 8px; margin-top: 10px;">
                    <button onclick="window.open('${c.folder}')" class="btn-action" style="background:var(--dark);">Vault</button>
                    <button onclick="window.location.href='project.html?prefillEmail=${encodeURIComponent(c.email)}'" class="btn-action" style="background:var(--primary);">Assign Job</button>
                </div>
            </div>`).join('');
    }

    async function startOnboarding(email) {
        if (!confirm("Email contract and ID upload links to applicant?")) return;
        await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'startOnboarding', email: email }) });
        alert("Paperwork sent.");
        loadDashboard();
    }

    async function finalizeHire(email) {
        const tier = prompt("Assign Pay Tier (Tier 1, Tier 2, etc):");
        if (!tier) return;
        await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'finalizeHire', email: email, assignedTier: tier }) });
        alert("Worker added to Active Roster.");
        loadDashboard();
    }

    window.onload = loadDashboard;
</script>
</body>
</html>
