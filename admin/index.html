<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="../styles.css">
    <title>Well Done Admin</title>
    <style>
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; padding: 20px; }
        .col { background: #eee; padding: 10px; border-radius: 8px; min-height: 80vh; }
        .card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 5px; border-left: 5px solid #ffa500; }
        .active-card { border-left-color: #2e7d32; }
    </style>
</head>
<body>
    <div class="grid">
        <div class="col"><h3>1. Applicants</h3><div id="list1"></div></div>
        <div class="col"><h3>2. Full Crew (Inactive)</h3><div id="list2"></div></div>
        <div class="col"><h3>3. Active List</h3><div id="list3"></div></div>
    </div>

    <script>
        const scriptURL = 'YOUR_DEPLOYED_URL_HERE'; // <--- PASTE YOUR URL HERE

        async function load() {
            const res = await fetch(scriptURL + "?action=getDashboard");
            const data = await res.json();
            
            // Render List 1
            document.getElementById('list1').innerHTML = data.applicants.map(a => `
                <div class="card"><strong>${a.name}</strong><br>${a.trade}<br>
                <button onclick="hire('${a.email}')">Hire (Inactive)</button></div>
            `).join('');

            // Render List 2 & 3
            const inactive = data.activeCrew.filter(c => c.status !== 'Active');
            const active = data.activeCrew.filter(c => c.status === 'Active');

            document.getElementById('list2').innerHTML = inactive.map(c => `
                <div class="card"><strong>${c.name}</strong><br>${c.tier}<br>
                <button onclick="location.href='project.html?prefillEmail=${c.email}'">Offer Work Order</button></div>
            `).join('');

            document.getElementById('list3').innerHTML = active.map(c => `
                <div class="card active-card"><strong>${c.name}</strong><br>ON MISSION</div>
            `).join('');
        }

        async function hire(email) {
            const tier = prompt("Assign Pay Tier:");
            if(!tier) return;
            await fetch(scriptURL, { method: 'POST', body: JSON.stringify({ action: 'finalizeHire', email, assignedTier: tier }) });
            load();
        }
        window.onload = load;
    </script>
</body>
</html>
