<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Center | Well Done</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; padding: 20px; }
        .section-header { border-bottom: 3px solid #333; padding-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        .card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #ccc; }
        .status-active { border-left-color: #2e7d32; }
        .status-inactive { border-left-color: #c0392b; }
        button { cursor: pointer; padding: 5px 10px; margin-top: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <h2 style="padding-left: 20px;">Well Done Construction Admin</h2>
    
    <div class="admin-grid">
        <section>
            <div class="section-header" style="border-color: #ef6c00;">1. Applicants</div>
            <div id="applicantList">Loading...</div>
        </section>

        <section>
            <div class="section-header">2. Full Crew (All)</div>
            <div id="fullCrewList">Loading...</div>
        </section>

        <section>
            <div class="section-header" style="border-color: #2e7d32;">3. Active List</div>
            <div id="activeList">Loading...</div>
        </section>
    </div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzgDKD-WxUrdxIPzyNOQ1Re00tZG23RHaiD0FLzs6Lv07YK916vPEMVx3ivYi9IhYKd/exec';

    async function loadData() {
        const response = await fetch(scriptURL + "?action=getDashboard");
        const data = await response.json();
        
        // 1. Render Applicants
        document.getElementById('applicantList').innerHTML = data.applicants.map(a => `
            <div class="card">
                <strong>${a.name}</strong><br>${a.trade}<br>
                <button onclick="startOnboarding('${a.email}')">Send Paperwork</button>
                <button onclick="finalizeHire('${a.email}')" style="background:#eee; color:black;">Hire (Inactive)</button>
            </div>
        `).join('');

        // 2. Render Full Crew (All Inactive/Blacklisted/Active)
        document.getElementById('fullCrewList').innerHTML = data.activeCrew.map(c => `
            <div class="card ${c.status === 'Active' ? 'status-active' : 'status-inactive'}">
                <strong>${c.name}</strong> [${c.status}]<br>${c.trade} | ${c.tier}<br>
                <button onclick="updateStatus('${c.email}', 'Active')">Activate</button>
                <button onclick="updateStatus('${c.email}', 'Blacklist')" style="color:red">Blacklist</button>
            </div>
        `).join('');

        // 3. Render Active Only
        document.getElementById('activeList').innerHTML = data.activeCrew.filter(c => c.status === 'Active').map(c => `
            <div class="card status-active">
                <strong>${c.name}</strong><br>${c.trade}<br>
                <button onclick="window.location.href='project.html?prefillEmail=${c.email}'" style="background:#2e7d32; color:white;">Assign Mission</button>
                <button onclick="updateStatus('${c.email}', 'Inactive')">Deactivate</button>
            </div>
        `).join('');
    }

    async function updateStatus(email, newStatus) {
        await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'toggleStatus', email, newStatus }) });
        loadData();
    }

    // (Include startOnboarding and finalizeHire functions here)

    window.onload = loadData;
</script>
</body>
</html>
