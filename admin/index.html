<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center | Well Done</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root { --accent: #ef6c00; --primary: #2e7d32; --dark: #343E47; --danger: #c0392b; }
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; padding: 20px; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
        .column { background: #ebedef; padding: 15px; border-radius: 8px; min-height: 80vh; }
        .column-header { text-align: center; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; padding: 10px; border-bottom: 4px solid #333; }
        .card { background: white; padding: 15px; margin-bottom: 12px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #ccc; }
        
        /* Status Colors */
        .status-active { border-left-color: var(--primary); }
        .status-inactive { border-left-color: var(--danger); }
        .status-new { border-left-color: var(--accent); }

        .btn-sm { padding: 6px 10px; font-size: 11px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; margin-top: 5px; color: white; transition: 0.2s; }
        .btn-hire { background: var(--dark); }
        .btn-paper { background: var(--accent); }
        .btn-activate { background: var(--primary); }
        .btn-blacklist { background: #000; }
        
        .info { font-size: 12px; color: #555; margin: 5px 0; }
    </style>
</head>
<body>

<div class="admin-grid">
    <section class="column">
        <div class="column-header" style="border-color: var(--accent);">1. Applicants</div>
        <div id="applicantList">Syncing...</div>
    </section>

    <section class="column">
        <div class="column-header">2. Full Crew (Inactive)</div>
        <div id="fullCrewList">Syncing...</div>
    </section>

    <section class="column">
        <div class="column-header" style="border-color: var(--primary);">3. Active List</div>
        <div id="activeList">Syncing...</div>
    </section>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzgDKD-WxUrdxIPzyNOQ1Re00tZG23RHaiD0FLzs6Lv07YK916vPEMVx3ivYi9IhYKd/exec';

    async function refresh() {
        try {
            const response = await fetch(scriptURL + "?action=getDashboard");
            const data = await response.json();
            renderApplicants(data.applicants);
            renderCrew(data.activeCrew);
        } catch (e) { console.error("Data Fetch Error", e); }
    }

    function renderApplicants(list) {
        const container = document.getElementById('applicantList');
        container.innerHTML = list.map(a => `
            <div class="card status-new">
                <strong>${a.name}</strong>
                <div class="info">🔧 ${a.trade} | 📞 ${a.phone}</div>
                <button onclick="startOnboarding('${a.email}')" class="btn-sm btn-paper">Send Paperwork</button>
                <button onclick="finalizeHire('${a.email}')" class="btn-sm btn-hire">Hire (Inactive)</button>
            </div>
        `).join('');
    }

    function renderCrew(crew) {
        // List 2: Full Crew (Filtered for Inactive/Blacklist)
        document.getElementById('fullCrewList').innerHTML = crew.filter(c => c.status !== 'Active').map(c => `
            <div class="card status-inactive">
                <strong>${c.name}</strong> <small>[${c.status}]</small>
                <div class="info">${c.trade} | ${c.tier}</div>
                <button onclick="updateStatus('${c.email}', 'Active')" class="btn-sm btn-activate">Activate</button>
                <button onclick="updateStatus('${c.email}', 'Blacklist')" class="btn-sm btn-blacklist">Blacklist</button>
            </div>
        `).join('');

        // List 3: Active Only
        document.getElementById('activeList').innerHTML = crew.filter(c => c.status === 'Active').map(c => `
            <div class="card status-active">
                <strong>${c.name}</strong>
                <div class="info">${c.trade} | ${c.tier}</div>
                <div style="display:flex; gap:5px;">
                    <button onclick="window.location.href='project.html?prefillEmail=${encodeURIComponent(c.email)}'" class="btn-sm btn-activate">Dispatch</button>
                    <button onclick="updateStatus('${c.email}', 'Inactive')" class="btn-sm btn-hire">Deactivate</button>
                </div>
            </div>
        `).join('');
    }

    async function startOnboarding(email) {
        const tier = prompt("Enter Pay Tier for paperwork (e.g. Tier 1):");
        if(!tier) return;
        await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'startOnboarding', email, payTier: tier }) });
        alert("Paperwork sent to " + email);
        refresh();
    }

    async function finalizeHire(email) {
        const tier = prompt("Confirm Pay Tier for Hire:");
        if(!tier) return;
        await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'finalizeHire', email, assignedTier: tier }) });
        alert("Worker added to database as Inactive.");
        refresh();
    }

    async function updateStatus(email, newStatus) {
        await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'toggleStatus', email, newStatus }) });
        refresh();
    }

    window.onload = refresh;
</script>
</body>
</html>
