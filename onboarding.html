<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Credentials | Well Done</title>
    <style>
        body { text-align: center; background-color: #1a1a1a; color: #fff; font-family: -apple-system, sans-serif; padding: 20px; }
        
        .container { max-width: 500px; margin: 0 auto; }
        
        .logo { font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; }
        .logo span { color: #e67e22; }

        .upload-zone {
            background: #222;
            border: 2px dashed #444;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            position: relative;
        }

        .upload-icon { font-size: 2rem; color: #666; margin-bottom: 10px; }
        
        /* Hidden real input */
        input[type="file"] { display: none; }

        /* Custom Label acts as button */
        .custom-upload-btn {
            background: #444;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            display: inline-block;
            margin-top: 10px;
            font-size: 0.9rem;
            transition: background 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }
        .custom-upload-btn:hover { background: #555; }

        .preview-img {
            max-width: 100%;
            max-height: 150px;
            margin-top: 15px;
            display: none; /* Hidden until file selected */
            border: 1px solid #e67e22;
            border-radius: 4px;
        }

        .file-name { color: #e67e22; font-size: 0.8rem; margin-top: 5px; }

        #submitBtn {
            width: 100%;
            padding: 15px;
            background-color: #e67e22;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
        }
        #submitBtn:disabled { background-color: #555; cursor: not-allowed; }
        
        .status-msg { margin-top: 20px; font-weight: bold; min-height: 24px; color: #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">WELL <span>DONE</span></div>
        <h2>Credential Upload</h2>
        <p style="color: #ccc; font-size: 0.9rem; margin-bottom: 30px;">
            Please upload clear photos of your required documents.
        </p>

        <form id="docForm">
            
            <div class="upload-zone" id="zone-id">
                <div class="upload-icon">🪪</div>
                <div style="font-weight:bold;">GOVERNMENT ID</div>
                <div style="font-size:0.8rem; color:#888;">Driver's License or Passport</div>
                
                <label for="file-id" class="custom-upload-btn">Choose Photo</label>
                <input type="file" id="file-id" accept="image/*" required>
                
                <div id="name-id" class="file-name"></div>
                <img id="preview-id" class="preview-img">
            </div>

            <div class="upload-zone" id="zone-osha">
                <div class="upload-icon">⛑️</div>
                <div style="font-weight:bold;">OSHA / SAFETY CARD</div>
                <div style="font-size:0.8rem; color:#888;">OSHA 10, OSHA 30, or SST</div>
                
                <label for="file-osha" class="custom-upload-btn">Choose Photo</label>
                <input type="file" id="file-osha" accept="image/*">
                
                <div id="name-osha" class="file-name"></div>
                <img id="preview-osha" class="preview-img">
            </div>

            <button type="submit" id="submitBtn">Submit Documents</button>
        </form>
        
        <div id="status" class="status-msg"></div>
    </div>

<script>
    // ✅ Active Deployment URL
    const API_URL = "https://script.google.com/macros/s/AKfycbxqwDS9Jufsc_2uJkYfjjcLI5QQhcapCCtaq5VgP3o8mAhhxWwcy6051sHGWsmmS2St/exec";

    // 1. Get Identity from URL
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');

    if (!email) {
        alert("Session Error. Redirecting to start.");
        window.location.href = "../index.html";
    }

    // 2. File Reader Logic for Previews
    function setupUploader(inputId, previewId, nameId) {
        const inputElement = document.getElementById(inputId);
        if(!inputElement) return; 

        inputElement.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById(nameId).textContent = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById(previewId);
                    img.src = e.target.result;
                    img.style.display = "block";
                };
                reader.readAsDataURL(file);
            }
        });
    }

    setupUploader('file-id', 'preview-id', 'name-id');
    setupUploader('file-osha', 'preview-osha', 'name-osha');

    // 🚀 NEW: Image Compressor (Fixes "Failed to Fetch" limits)
    const compressImage = (file) => {
        return new Promise((resolve, reject) => {
            if (!file) return resolve(null);
            
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Max dimensions to prevent massive payloads
                    const MAX_WIDTH = 1200;
                    const MAX_HEIGHT = 1200;
                    let width = img.width;
                    let height = img.height;

                    // Calculate new dimensions keeping aspect ratio
                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    
                    // Draw and compress to 70% quality JPEG
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    resolve(compressedBase64);
                };
                img.onerror = err => reject(err);
            };
            reader.onerror = error => reject(error);
        });
    };

    // 3. Submit Logic
    document.getElementById('docForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        
        const idFile = document.getElementById('file-id').files[0];
        const oshaFile = document.getElementById('file-osha').files[0];

        if (!idFile) return alert("You must upload a Government ID.");

        btn.disabled = true;
        btn.textContent = "COMPRESSING & UPLOADING...";
        status.textContent = "Optimizing images... Please wait.";

        try {
            // Compress the files BEFORE sending to Google
            const idBase64 = await compressImage(idFile);
            const oshaBase64 = await compressImage(oshaFile);

            const payload = {
                action: 'uploadOnboardingDocs',
                email: email,
                idBase64: idBase64,
                oshaBase64: oshaBase64 
            };

            status.textContent = "Transmitting to secure server...";

            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8",
                },
                body: JSON.stringify(payload)
            });

            // GAS redirects (302) can sometimes make response.json() fail on the frontend,
            // but if it didn't throw a 'Failed to fetch', the payload made it through!
            
            status.textContent = "Documents Received. Finalizing...";
            status.style.color = "#2ecc71";
            
            setTimeout(() => {
                window.location.href = "verification-pending.html";
            }, 1500);

        } catch (err) {
            console.error(err);
            status.textContent = "Upload Failed: " + err.message + " (Check your connection)";
            status.style.color = "#e74c3c"; 
            btn.disabled = false;
            btn.textContent = "Try Again";
        }
    });
</script>
</body>
</html>
