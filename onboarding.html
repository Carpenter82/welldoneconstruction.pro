<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Credentials | Well Done</title>
    <style>
        body { text-align: center; background-color: #1a1a1a; color: #fff; font-family: -apple-system, sans-serif; padding: 20px; }
        
        .container { max-width: 500px; margin: 0 auto; }
        
        .logo { font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; }
        .logo span { color: #e67e22; }

        .upload-zone {
            background: #222;
            border: 2px dashed #444;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            position: relative;
        }

        .upload-icon { font-size: 2rem; color: #666; margin-bottom: 10px; }
        
        /* Hidden real input */
        input[type="file"] { display: none; }

        /* Custom Label acts as button */
        .custom-upload-btn {
            background: #444;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            display: inline-block;
            margin-top: 10px;
            font-size: 0.9rem;
            transition: background 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }
        .custom-upload-btn:hover { background: #555; }

        .preview-img {
            max-width: 100%;
            max-height: 150px;
            margin-top: 15px;
            display: none; /* Hidden until file selected */
            border: 1px solid #e67e22;
            border-radius: 4px;
        }

        .file-name { color: #e67e22; font-size: 0.8rem; margin-top: 5px; }

        #submitBtn {
            width: 100%;
            padding: 15px;
            background-color: #e67e22;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
        }
        #submitBtn:disabled { background-color: #555; cursor: not-allowed; }
        
        .status-msg { margin-top: 20px; font-weight: bold; min-height: 24px; color: #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">WELL <span>DONE</span></div>
        <h2>Credential Upload</h2>
        <p style="color: #ccc; font-size: 0.9rem; margin-bottom: 30px;">
            Please upload clear photos of your required documents.
        </p>

        <form id="docForm">
            
            <div class="upload-zone" id="zone-id">
                <div class="upload-icon">🪪</div>
                <div style="font-weight:bold;">GOVERNMENT ID</div>
                <div style="font-size:0.8rem; color:#888;">Driver's License or Passport</div>
                
                <label for="file-id" class="custom-upload-btn">Choose Photo</label>
                <input type="file" id="file-id" accept="image/*" required>
                
                <div id="name-id" class="file-name"></div>
                <img id="preview-id" class="preview-img">
            </div>

            <div class="upload-zone" id="zone-osha">
                <div class="upload-icon">⛑️</div>
                <div style="font-weight:bold;">OSHA / SAFETY CARD</div>
                <div style="font-size:0.8rem; color:#888;">OSHA 10, OSHA 30, or SST</div>
                
                <label for="file-osha" class="custom-upload-btn">Choose Photo</label>
                <input type="file" id="file-osha" accept="image/*">
                
                <div id="name-osha" class="file-name"></div>
                <img id="preview-osha" class="preview-img">
            </div>

            <button type="submit" id="submitBtn">Submit Documents</button>
        </form>
        
        <div id="status" class="status-msg"></div>
    </div>

    <script>
        // UPDATED DEPLOYMENT ID (v138)
        const API_URL = "https://script.google.com/macros/s/AKfycbwtLjTRDPDe7aPXO7eKVLjPQgDe6pv8fhcpAKZU2ba8QkhnyQEk985yfnoe34nDGdrb/exec"; 

        // 1. Get Identity from URL
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');

        if (!email) {
            alert("Session Error. Redirecting to start.");
            window.location.href = "../index.html";
        }

        // 2. File Reader Logic
        function setupUploader(inputId, previewId, nameId) {
            document.getElementById(inputId).addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    document.getElementById(nameId).textContent = file.name;
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.getElementById(previewId);
                        img.src = e.target.result;
                        img.style.display = "block";
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        setupUploader('file-id', 'preview-id', 'name-id');
        setupUploader('file-osha', 'preview-osha', 'name-osha');

        // 3. Submit Logic
        document.getElementById('docForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');
            
            const idFile = document.getElementById('file-id').files[0];
            const oshaFile = document.getElementById('file-osha').files[0];

            if (!idFile) return alert("You must upload a Government ID.");

            btn.disabled = true;
            btn.textContent = "ENCRYPTING & UPLOADING...";

            // Helper to read file as Base64
            const readFile = (file) => {
                return new Promise((resolve) => {
                    if (!file) resolve(null); 
                    const reader = new FileReader();
                    reader.onload = () => resolve({
                        name: file.name,
                        data: reader.result.split(',')[1] 
                    });
                    reader.readAsDataURL(file);
                });
            };

            // Process both files
            Promise.all([readFile(idFile), readFile(oshaFile)])
            .then(results => {
                const payload = {
                    action: "saveDocuments",
                    email: email,
                    idFile: results[0],
                    oshaFile: results[1]
                };

                return fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    body: JSON.stringify(payload)
                });
            })
            .then(() => {
                status.textContent = "Documents Received. Processing Payroll...";
                status.style.color = "#2ecc71";
                
                setTimeout(() => {
                    alert("Onboarding Complete! Please check your email for Gusto payroll setup.");
                    window.location.href = "../portal/index.html?email=" + encodeURIComponent(email);
                }, 2000);
            })
            .catch(err => {
                console.error(err);
                status.textContent = "Upload Failed. Try smaller photos.";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
