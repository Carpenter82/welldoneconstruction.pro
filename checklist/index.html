<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Complete | Well Done</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .camera-btn {
            background: #222;
            border: 2px dashed var(--primary);
            color: var(--primary);
            padding: 40px;
            width: 100%;
            margin-bottom: 20px;
            cursor: pointer;
            border-radius: 8px;
            display: block;
            text-align: center;
            box-sizing: border-box;
            font-weight: bold;
        }
        #preview { width: 100%; display: none; border: 2px solid var(--primary); margin-bottom: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Job Completion</h2>
        <p style="color:#888;">Upload proof of work to clock out.</p>

        <label class="camera-btn">
            📷 TAP TO TAKE PHOTO
            <input type="file" id="sitePhoto" accept="image/*" capture="environment" style="display:none;">
        </label>
        <img id="preview" alt="Site Photo">

        <div id="gpsStatus" style="font-size: 0.8rem; color: #666; margin-bottom: 20px; text-align: center;">
            Waiting for GPS...
        </div>

        <button id="finishBtn" disabled>SUBMIT & CLOCK OUT</button>
        <div id="status" class="status-msg"></div>
    </div>

    <script>
        // UPDATED DEPLOYMENT ID: Version 134
        const API_URL = "https://script.google.com/macros/s/AKfycbzgDKD-WxUrdxIPzyNOQ1Re00tZG23RHaiD0FLzs6Lv07YK916vPEMVx3ivYi9IhYKd/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        const jobId = urlParams.get('jobId');

        if(!email || !jobId) {
            alert("Error: Missing Job Data.");
            window.location.href = "../portal/dashboard.html";
        }

        let gpsData = null;
        let photoBase64 = null;

        // 1. GET GPS IMMEDIATELY
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    gpsData = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    const gpsText = document.getElementById('gpsStatus');
                    gpsText.textContent = "✅ GPS Locked: " + gpsData.lat.toFixed(4);
                    gpsText.style.color = "var(--active)"; // Green if defined in CSS, else relies on inherited
                    checkReady();
                },
                (err) => {
                    document.getElementById('gpsStatus').textContent = "⚠️ GPS Error: " + err.message;
                    document.getElementById('gpsStatus').style.color = "red";
                },
                { enableHighAccuracy: true }
            );
        } else {
            document.getElementById('gpsStatus').textContent = "❌ GPS Not Supported";
        }

        // 2. HANDLE PHOTO
        document.getElementById('sitePhoto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = document.getElementById('preview');
                    img.src = evt.target.result;
                    img.style.display = "block";
                    photoBase64 = evt.target.result.split(',')[1]; // Clean Base64
                    checkReady();
                };
                reader.readAsDataURL(file);
            }
        });

        function checkReady() {
            if(gpsData && photoBase64) {
                const btn = document.getElementById('finishBtn');
                btn.disabled = false;
                btn.style.backgroundColor = "var(--primary)";
            }
        }

        // 3. SUBMIT
        document.getElementById('finishBtn').addEventListener('click', () => {
            const btn = document.getElementById('finishBtn');
            const status = document.getElementById('status');
            
            btn.textContent = "Uploading Evidence...";
            btn.disabled = true;

            const payload = {
                action: "logGPS",
                type: "completion",
                email: email,
                jobId: jobId,
                lat: gpsData.lat,
                lng: gpsData.lng,
                photo: photoBase64,
                // Add default filename for the script
                filename: `COMPLETION_${jobId}_${Date.now()}.jpg` 
            };

            fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            }).then(() => {
                status.textContent = "Work Logged. Redirecting...";
                setTimeout(() => {
                    // Send them back to the dashboard (which will now show 'Standby')
                    window.location.href = `../portal/dashboard.html?email=${encodeURIComponent(email)}`;
                }, 2000);
            }).catch(err => {
                status.textContent = "Error: " + err;
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
