<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Dashboard | Well Done</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root { --high-vis: #f1c40f; --dark: #000; --active: #33B26E; }
        body { background: #1a1a1a; color: white; font-family: sans-serif; padding: 15px; margin: 0; }
        .header { background: var(--high-vis); color: var(--dark); padding: 15px; font-weight: 900; text-align: center; letter-spacing: 1px; margin: -15px -15px 20px -15px; }
        .mission-card { background: var(--dark); border: 4px solid var(--high-vis); padding: 20px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .idle-msg { text-align: center; padding: 50px 20px; color: #666; font-style: italic; }
        .btn-mission { background: var(--high-vis); color: var(--dark); border: none; padding: 20px; width: 100%; font-size: 1.2rem; font-weight: 900; cursor: pointer; border-radius: 4px; margin-top: 15px; }
        .job-label { color: var(--high-vis); font-size: 0.8rem; text-transform: uppercase; margin-top: 10px; }
        .job-data { font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; }
        .warning-stripe { height: 10px; background: repeating-linear-gradient(45deg, var(--high-vis), var(--high-vis) 10px, var(--dark) 10px, var(--dark) 20px); margin: 15px 0; }
    </style>
</head>
<body>

    <div class="header">WELL DONE CONSTRUCTION | FIELD OPERATIONS</div>

    <div id="loading" style="text-align:center; padding: 40px;">SECURE CONNECTION ESTABLISHING...</div>

    <div id="idleState" class="idle-msg" style="display:none;">
        <p>Current Status: <strong>IDLE</strong></p>
        <p>No active missions assigned to your email at this time. Check back at 08:00 AM.</p>
    </div>

    <div id="missionState" class="mission-card">
        <div class="warning-stripe"></div>
        <h2 style="margin:0; color:var(--high-vis);">ACTIVE MISSION</h2>
        
        <div class="job-label">Job ID</div>
        <div id="jobId" class="job-data">---</div>

        <div class="job-label">Client</div>
        <div id="client" class="job-data">---</div>

        <div class="job-label">Address / Location</div>
        <div id="address" class="job-data" style="color:#fff; text-decoration: underline;">---</div>

        <div class="job-label">Scope of Work</div>
        <div id="notes" style="background:#222; padding:10px; border-radius:4px; font-size: 0.9rem;">---</div>

        <button id="actionBtn" class="btn-mission" onclick="startChecklist()">CLAIM MISSION & START CHECKLIST</button>
    </div>

<script>
    // ✅ MUST MATCH YOUR DEPLOYMENT URL
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzgDKD-WxUrdxIPzyNOQ1Re00tZG23RHaiD0FLzs6Lv07YK916vPEMVx3ivYi9IhYKd/exec';

    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');

    if (!email) {
        alert("Authentication Error: No email found.");
        window.location.href = "index.html";
    }

    async function checkJobStatus() {
        try {
            const response = await fetch(`${scriptURL}?action=getWorkerJob&email=${encodeURIComponent(email)}`);
            const data = await response.json();
            
            document.getElementById('loading').style.display = 'none';

            if (data.jobStatus === "Offered" || data.jobStatus === "Active") {
                document.getElementById('missionState').style.display = 'block';
                document.getElementById('jobId').innerText = data.jobId;
                document.getElementById('client').innerText = data.client;
                document.getElementById('address').innerText = data.address;
                document.getElementById('notes').innerText = data.notes || "No additional notes provided.";
                
                // If already active, change button text
                if (data.jobStatus === "Active") {
                    document.getElementById('actionBtn').innerText = "OPEN ACTIVE CHECKLIST";
                }
            } else {
                document.getElementById('idleState').style.display = 'block';
            }
        } catch (err) {
            document.getElementById('loading').innerText = "CONNECTION TIMEOUT. RETRYING...";
            console.error(err);
        }
    }

    function startChecklist() {
        const jobId = document.getElementById('jobId').innerText;
        // Redirects to your checklist folder
        window.location.href = `../checklist/index.html?email=${encodeURIComponent(email)}&jobId=${encodeURIComponent(jobId)}`;
    }

    window.onload = checkJobStatus;
</script>
</body>
</html>
