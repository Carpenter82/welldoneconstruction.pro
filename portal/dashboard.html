<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Log & Checklist | Well Done Construction</title>
    <style>
        :root { 
            --high-vis: #f1c40f; 
            --dark: #000; 
            --active: #33B26E; 
            --prep: #3498db;
            --panel-bg: #111; 
            --border: #333;
            --danger: #e74c3c;
        }
        
        body { background: #1a1a1a; color: white; font-family: -apple-system, sans-serif; padding: 0; margin: 0; }
        .header { background: var(--dark); color: white; padding: 15px; font-weight: 900; text-align: center; border-bottom: 2px solid var(--high-vis); font-size: 1.1rem; }
        .warning-stripes { height: 8px; background: repeating-linear-gradient(45deg, var(--high-vis), var(--high-vis) 10px, #000 10px, #000 20px); }
        .container { padding: 15px; max-width: 500px; margin: 0 auto; }
        
        .card { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 15px; }
        .job-banner { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; }
        .job-id { font-weight: 900; color: var(--high-vis); font-size: 1.2rem; }
        
        .status-badge { font-size: 0.75rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; text-align: center;}
        .status-off { background: #333; color: #888; }
        .status-on { background: var(--active); color: white; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .step-title { font-size: 0.85rem; font-weight: 900; text-transform: uppercase; color: #888; letter-spacing: 1px; margin-bottom: 10px; }
        
        .file-input-wrapper { position: relative; margin-bottom: 15px; }
        .file-label { display: block; background: #222; border: 1px dashed #555; padding: 15px; text-align: center; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .file-label:hover { border-color: var(--high-vis); }
        .file-input { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .preview-img { width: 100%; max-height: 150px; object-fit: cover; border-radius: 4px; margin-top: 10px; display: none; border: 1px solid var(--border); }

        .btn { width: 100%; padding: 14px; font-size: 0.95rem; font-weight: 900; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; transition: 0.2s; }
        .btn-start { background: var(--high-vis); color: var(--dark); }
        .btn-stop { background: var(--danger); color: white; }
        .btn-submit { background: var(--active); color: white; }
        .btn:disabled { background: #444 !important; color: #777 !important; cursor: not-allowed; }

        .radio-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .radio-label { flex: 1; background: #222; border: 1px solid var(--border); padding: 12px; text-align: center; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .radio-input { display: none; }
        .radio-input:checked + .radio-label { border-color: var(--high-vis); color: var(--high-vis); background: #2a2510; }
        
        .time-display { font-family: monospace; font-size: 0.8rem; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header">FIELD TIME & EVIDENCE LOG</div>
    <div class="warning-stripes"></div>

    <div class="container">
        <!-- Shift Controls Card -->
        <div class="card">
            <div class="job-banner">
                <div>
                    <div id="displayJobId" class="job-id">JOB #---</div>
                    <div id="displayEmail" style="font-size: 0.75rem; color:#888;">---</div>
                </div>
                <div id="shiftStatus" class="status-badge status-off">Off Clock</div>
            </div>

            <!-- BUTTON 1: CLOCK IN -->
            <div id="clockInSection">
                <div class="step-title">Step 1: Log Site Arrival</div>
                <div class="file-input-wrapper">
                    <label class="file-label" id="arrivalFileLabel">📸 Take Arrival Photo</label>
                    <input type="file" accept="image/*" capture="camera" class="file-input" id="arrivalFile" onchange="processImage(this, 'arrival')">
                    <img id="arrivalPreview" class="preview-img">
                </div>
                <button id="clockInBtn" class="btn btn-start" onclick="clockIn()" disabled>Clock In & Begin Work</button>
            </div>

            <!-- BUTTON 2: CLOCK OUT -->
            <div id="clockOutSection" style="display: none;">
                <div class="step-title">Step 2: Log Site Departure</div>
                <div class="time-display" id="clockInTimeDisplay">Clocked In At: --:--</div>
                <br>
                <div class="file-input-wrapper">
                    <label class="file-label" id="exitFileLabel">📸 Take Exit Photo</label>
                    <input type="file" accept="image/*" capture="camera" class="file-input" id="exitFile" onchange="processImage(this, 'exit')">
                    <img id="exitPreview" class="preview-img">
                </div>

                <div class="step-title">Mission Status Options</div>
                <div class="radio-group">
                    <input type="radio" name="isFinal" id="statusPause" value="false" checked class="radio-input">
                    <label for="statusPause" class="radio-label">Pause<br><span style="font-size:0.65rem; font-weight:normal; color:#888;">Returning Tomorrow</span></label>

                    <input type="radio" name="isFinal" id="statusComplete" value="true" class="radio-input">
                    <label for="statusComplete" class="radio-label">Complete<br><span style="font-size:0.65rem; font-weight:normal; color:#888;">Mission Finished</span></label>
                </div>

                <button id="clockOutBtn" class="btn btn-stop" onclick="clockOut()" disabled>End Shift & Submit Evidence</button>
            </div>
        </div>
    </div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxqwDS9Jufsc_2uJkYfjjcLI5QQhcapCCtaq5VgP3o8mAhhxWwcy6051sHGWsmmS2St/exec";
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');
    const jobId = urlParams.get('jobId');

    // State placeholders
    let localData = {
        isClockedIn: false,
        clockInTime: null,
        arrivalBase64: null,
        exitBase64: null,
        lat: null,
        lng: null
    };

    // Load State on Init
    window.onload = function() {
        if (!email || !jobId) {
            alert("Context error: Missing email or Job ID parameters.");
            return;
        }
        document.getElementById('displayJobId').innerText = "JOB #" + jobId;
        document.getElementById('displayEmail').innerText = email;

        // Sync with local storage using unique keys for this job/worker context
        const savedState = localStorage.getItem(`shift_${email}_${jobId}`);
        if(savedState) {
            localData = JSON.parse(savedState);
            if(localData.isClockedIn) {
                restoreActiveShiftUI();
            }
        }
    };

    // Compress images to keep payload size safely clear of Google's limits
    function processImage(input, type) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                // Max dimension constraint
                const max_size = 1000; 
                if (width > height && width > max_size) { height *= max_size / width; width = max_size; }
                else if (height > max_size) { width *= max_size / height; height = max_size; }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2adapter-context', { alpha: false });
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);

                // Convert to compressed JPEG data string
                const base64 = canvas.toDataURL('image/jpeg', 0.7);
                
                if(type === 'arrival') {
                    localData.arrivalBase64 = base64;
                    document.getElementById('arrivalPreview').src = base64;
                    document.getElementById('arrivalPreview').style.display = 'block';
                    document.getElementById('arrivalFileLabel').innerText = "✅ Photo Captured";
                    document.getElementById('clockInBtn').disabled = false;
                } else {
                    localData.exitBase64 = base64;
                    document.getElementById('exitPreview').src = base64;
                    document.getElementById('exitPreview').style.display = 'block';
                    document.getElementById('exitFileLabel').innerText = "✅ Photo Captured";
                    document.getElementById('clockOutBtn').disabled = false;
                }
                saveState();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function clockIn() {
        if (!navigator.geolocation) {
            alert("GPS location tracking required to clock in on this job.");
            return;
        }

        document.getElementById('clockInBtn').disabled = true;
        document.getElementById('clockInBtn').innerText = "Capturing GPS...";

        navigator.geolocation.getCurrentPosition(
            (position) => {
                localData.isClockedIn = true;
                localData.clockInTime = new Date().toISOString();
                localData.lat = position.coords.latitude;
                localData.lng = position.coords.longitude;
                saveState();
                restoreActiveShiftUI();
            },
            (error) => {
                alert("GPS Error: Could not verify location. Please check phone settings and try again.");
                document.getElementById('clockInBtn').disabled = false;
                document.getElementById('clockInBtn').innerText = "Clock In & Begin Work";
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function restoreActiveShiftUI() {
        document.getElementById('clockInSection').style.display = 'none';
        document.getElementById('clockOutSection').style.display = 'block';
        
        const statusBadge = document.getElementById('shiftStatus');
        statusBadge.innerText = "On Clock";
        statusBadge.className = "status-badge status-on";

        const startTime = new Date(localData.clockInTime);
        document.getElementById('clockInTimeDisplay').innerText = `Clocked In At: ${startTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
    }

    async function clockOut() {
        const btn = document.getElementById('clockOutBtn');
        btn.disabled = true;
        btn.innerText = "Encrypting & Uploading Logs...";

        const isFinalSelection = document.getElementById('statusComplete').checked;

        // Package up structured data matching your v17.2 engine parameters exactly
        const payload = {
            action: "logWork",
            email: email,
            ancestryID: jobId,
            entryPhoto: [localData.arrivalBase64], // Backend parses arrays
            exitPhoto: [localData.exitBase64],
            lat: localData.lat,
            lng: localData.lng,
            isFinal: isFinalSelection,
            clockInTime: localData.clockInTime, // Compliance metrics
            clockOutTime: new Date().toISOString() // Compliance metrics
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" }, // Bypasses CORS redirects
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            
            if (result.status === "success") {
                alert("Shift verified successfully. Evidence filed to your project log.");
                localStorage.removeItem(`shift_${email}_${jobId}`); // Safely purge cached state
                window.location.href = `../portal/index.html?email=${encodeURIComponent(email)}`;
            } else {
                throw new Error(result.message || "Unknown gateway error.");
            }
        } catch (err) {
            alert("Transmission Error: " + err.message);
            btn.disabled = false;
            btn.innerText = "End Shift & Submit Evidence";
        }
    }

    function saveState() {
        localStorage.setItem(`shift_${email}_${jobId}`, JSON.stringify(localData));
    }
</script>
</body>
</html>
