<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Portal | Well Done Construction</title>
    <link rel="icon" type="image/png" href="https://welldoneconstruction.link/wp-content/uploads/2025/11/well-done-construction-favicon.png">
    <style>
        :root { 
            --high-vis: #f1c40f; 
            --dark: #000; 
            --active: #33B26E; 
            --prep: #3498db;
            --panel-bg: #111; 
            --border: #333;
        }
        
        body { background: #1a1a1a; color: white; font-family: -apple-system, sans-serif; padding: 0; margin: 0; }
        .header { background: var(--high-vis); color: var(--dark); padding: 20px; font-weight: 900; text-align: center; border-bottom: 4px solid #000; letter-spacing: 1px; }
        .warning-stripes { height: 15px; background: repeating-linear-gradient(45deg, var(--high-vis), var(--high-vis) 20px, #000 20px, #000 40px); }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        
        .profile-card { background: var(--panel-bg); border: 2px solid var(--border); border-radius: 8px; padding: 20px; margin-top: 10px; }
        .profile-header { display: flex; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 15px; }
        .avatar { width: 50px; height: 50px; background: #333; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; margin-right: 15px; border: 2px solid var(--high-vis); }
        .profile-name { font-size: 1.2rem; font-weight: 900; margin: 0; text-transform: uppercase; }
        .profile-email { font-size: 0.8rem; color: #888; margin: 0; }
        
        .tag-row { display: flex; gap: 10px; }
        .tag { background: #222; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; border: 1px solid #444; color: #ccc; }
        .tag-accent { border-color: var(--active); color: var(--active); }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        @media (max-width: 500px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .status-panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .panel-header { background: #222; font-size: 0.7rem; font-weight: 900; padding: 10px; text-align: center; border-bottom: 1px solid var(--border); color: #888; letter-spacing: 1px; text-transform: uppercase; }
        .panel-content { padding: 15px; flex-grow: 1; }

        .mission-offer { border-top: 3px solid var(--high-vis); padding-top: 10px; margin-bottom: 20px; }
        .label { color: var(--high-vis); font-size: 0.65rem; text-transform: uppercase; font-weight: 900; margin-bottom: 2px; }
        .data-point { font-size: 1rem; font-weight: bold; margin-bottom: 10px; line-height: 1.2; }
        
        .btn-claim { 
            background: var(--high-vis); color: var(--dark); border: none; padding: 12px; width: 100%; 
            font-size: 0.9rem; font-weight: 900; cursor: pointer; border-radius: 4px; margin-top: 5px; 
            transition: 0.2s; text-transform: uppercase; 
        }
        .btn-claim:hover { filter: brightness(1.1); }
        .btn-claim:disabled { background: #444; color: #888; cursor: not-allowed; }
        
        .status-msg { font-size: 0.75rem; font-weight: 900; text-align: center; margin-bottom: 10px; padding: 5px; border-radius: 4px; }
        .status-prep { background: var(--prep); color: white; }
        .status-active { background: var(--active); color: white; }

        .placeholder-text { color: #555; font-size: 0.85rem; line-height: 1.4; text-align: center; }
        .board-item { border-bottom: 1px solid var(--border); padding: 15px 0; }
        .board-item:last-child { border-bottom: none; }
        .pay-badge { float: right; color: var(--active); font-weight: 900; }
    </style>
</head>
<body>

    <div class="header">FIELD OPERATIONS DASHBOARD</div>
    <div class="warning-stripes"></div>

    <div class="container">
        <div id="profileSection" class="profile-card">
            <div class="profile-header">
                <div class="avatar">👤</div>
                <div>
                    <h2 id="workerName" class="profile-name">Authenticating...</h2>
                    <p id="workerEmail" class="profile-email">---</p>
                </div>
            </div>
            <div class="tag-row">
                <div class="tag" id="workerTrade">Trade: ---</div>
                <div class="tag tag-accent" id="workerConsent">Consent: ---</div>
            </div>
        </div>

        <div class="dashboard-grid">
            
            <div class="status-panel">
                <div class="panel-header">Active Mission</div>
                <div class="panel-content" id="directDispatchContent">
                    <div id="idleState">
                        <strong style="color:#444; display:block; margin-bottom:10px; text-align:center;">STATUS: STANDBY</strong>
                        <p class="placeholder-text">No active reservations. Check the Open Board for missions.</p>
                    </div>

                    <div id="missionState" style="display:none;" class="mission-offer">
                        <div id="statusLabel" class="status-msg">---</div>
                        <div class="label">Ancestry Job ID</div>
                        <div id="jobId" class="data-point">---</div>
                        <div class="label">Location</div>
                        <div id="address" class="data-point">---</div>
                        <button id="actionBtn" class="btn-claim" onclick="handleMissionAction()">Claim Mission</button>
                    </div>
                </div>
            </div>

            <div class="status-panel">
                <div class="panel-header">Open Board</div>
                <div class="panel-content">
                    <strong style="color:#666; display:block; margin-bottom:10px;">AVAILABLE</strong>
                    <div id="openBoardContainer">
                        <p class="placeholder-text">Scanning project log...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxQhVbb1DVGlY4QUtS_rfRn1gVAlrPfWdaxE_wXefGdcdjKvMLUnypu-yozYsX51oaa/exec'; 
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');
    let currentJobStatus = "Idle";

    if (!email) {
        alert("ID Context Missing.");
        window.location.href = "index.html";
    }

    async function refreshData() {
        try {
            const res = await fetch(`${scriptURL}?action=getWorkerJob&email=${encodeURIComponent(email)}&nocache=${Date.now()}`);
            const data = await res.json();
            
            if (data.profile) {
                document.getElementById('workerName').innerText = data.profile.name;
                document.getElementById('workerEmail').innerText = email;
                document.getElementById('workerTrade').innerText = "Trade: " + data.profile.trade;
                document.getElementById('workerConsent').innerText = "Consent: " + (data.profile.consent || "Pending");
            }

            const missionUI = document.getElementById('missionState');
            const idleUI = document.getElementById('idleState');
            const btn = document.getElementById('actionBtn');
            const statusLabel = document.getElementById('statusLabel');

            if (data.jobStatus === "Offered" || data.jobStatus === "RESERVED" || data.jobStatus === "Active") {
                currentJobStatus = data.jobStatus;
                missionUI.style.display = 'block';
                idleUI.style.display = 'none';
                document.getElementById('jobId').innerText = data.jobId;
                document.getElementById('address').innerText = data.address;
                
                if (data.jobStatus === "Offered") {
                    statusLabel.innerText = "MISSION PENDING";
                    statusLabel.className = "status-msg";
                    btn.innerText = "Accept Mission";
                    btn.style.background = "var(--high-vis)";
                } else if (data.jobStatus === "RESERVED") {
                    statusLabel.innerText = "PHASE: PREP TIME";
                    statusLabel.className = "status-msg status-prep";
                    btn.innerText = "I am On-Site: Open Checklist";
                    btn.style.background = "var(--prep)";
                    btn.style.color = "white";
                } else if (data.jobStatus === "Active") {
                    statusLabel.innerText = "PHASE: ACTIVE WORK";
                    statusLabel.className = "status-msg status-active";
                    btn.innerText = "Resume Checklist";
                    btn.style.background = "var(--active)";
                    btn.style.color = "white";
                }
            } else {
                missionUI.style.display = 'none';
                idleUI.style.display = 'block';
            }

            const boardRes = await fetch(`${scriptURL}?action=getOpenBoard&nocache=${Date.now()}`);
            const boardData = await boardRes.json();
            renderOpenBoard(boardData.projects || []);

        } catch (e) { console.error(e); }
    }

    function renderOpenBoard(projects) {
        const container = document.getElementById('openBoardContainer');
        if (projects.length === 0) {
            container.innerHTML = '<p class="placeholder-text">No missions broadcasting.</p>';
            return;
        }
        container.innerHTML = projects.map(p => `
            <div class="board-item">
                <span class="pay-badge">$${p.pay}</span>
                <div class="label">ID: ${p.id}</div>
                <div class="data-point" style="font-size:0.85rem;">${p.address}</div>
                <button class="btn-claim" style="padding:8px; font-size:0.75rem;" onclick="claimPublicMission('${p.id}', this)">Reserve Job</button>
            </div>
        `).join('');
    }

    async function handleMissionAction() {
        const btn = document.getElementById('actionBtn');
        const jobId = document.getElementById('jobId').innerText;

        if (currentJobStatus === "Offered") {
            if(!confirm("Claim this mission for Prep Time? This locks the job for 3 days.")) return;
            btn.disabled = true; btn.innerText = "RESERVING...";
            await fetch(scriptURL, {
                method: 'POST', mode: 'no-cors',
                body: JSON.stringify({ action: 'acceptMission', email: email, jobId: jobId })
            });
            alert("Reserved. Mission is now in PREP TIME.");
            refreshData();
        } else {
            // REDIRECT TO CHECKLIST (Transition to ACTIVE happens at checklist entry)
            goToChecklist(jobId);
        }
    }

    async function claimPublicMission(jobId, btn) {
        if(!confirm(`Reserve Job #${jobId}?`)) return;
        btn.disabled = true; btn.innerText = "...";
        await fetch(scriptURL, {
            method: 'POST', mode: 'no-cors',
            body: JSON.stringify({ action: 'acceptPublicJob', email: email, jobId: jobId })
        });
        alert("Job Reserved. See Active Mission panel for Prep details.");
        refreshData();
    }

    function goToChecklist(jobId) {
        window.location.href = `../checklist/index.html?email=${encodeURIComponent(email)}&jobId=${encodeURIComponent(jobId)}`;
    }

    window.onload = refreshData;
</script>
</body>
</html>
