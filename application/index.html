<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application | Well Done</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; color: #343E47; }
        .form-card { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #33B26E; color: white; font-weight: bold; border: none; cursor: pointer; }
        h2 { text-align: center; color: #343E47; }
    </style>
</head>
<body>
    <div class="form-card" id="mainCard">
        <h2>Worker Application</h2>
        <form id="appForm">
            <input type="text" name="fullName" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="tel" name="phone" placeholder="Phone Number" required>
            <select name="trade" required>
                <option value="">Select Primary Trade</option>
                <option value="Carpentry">Carpentry</option>
                <option value="Plumbing">Plumbing</option>
                <option value="Electrical">Electrical</option>
                <option value="Painting">Painting</option>
                <option value="General Labor">General Labor</option>
            </select>
            <button type="submit" id="submitBtn">Submit Application</button>
        </form>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzgDKD-WxUrdxIPzyNOQ1Re00tZG23RHaiD0FLzs6Lv07YK916vPEMVx3ivYi9IhYKd/exec';
        const form = document.getElementById('appForm');
        
        form.addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            const formData = new FormData(form);
            const nameParts = formData.get('fullName').split(' ');
            
            // This is the payload your Apps Script is looking for
            const payload = {
                action: 'intake',
                firstName: nameParts[0] || "",
                lastName: nameParts.slice(1).join(' ') || "Worker",
                email: formData.get('email'),
                phone: formData.get('phone'),
                trade: formData.get('trade'),
                experience: "New Web Lead",
                pay: "Pending",
                tools: "Yes"
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', // Critical for Google Apps Script
                cache: 'no-cache',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            }).then(() => {
                // Show success UI
                document.getElementById('mainCard').innerHTML = `
                    <div style="text-align:center; padding: 20px;">
                        <div style="font-size: 3rem;">✅</div>
                        <h2 style="color: #33B26E;">Application Sent!</h2>
                        <p>We have received your info. Check your email shortly for next steps.</p>
                        <a href="index.html" style="color: #343E47; font-weight: bold; text-decoration: none;">Return Home</a>
                    </div>`;
            }).catch(err => {
                alert("Error submitting. Please try again.");
                btn.innerText = "Submit Application";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
