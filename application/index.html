<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://welldoneconstruction.link/wp-content/uploads/2025/11/well-done-construction-favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application | Well Done</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; padding: 20px; color: #343E47; }
        .form-card { max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1rem; }
        button { background: #33B26E; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 20px; transition: background 0.3s; }
        button:hover { background: #28a061; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        h2 { text-align: center; color: #343E47; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; }
        label { font-size: 0.85rem; font-weight: bold; color: #6E797F; margin-left: 2px; }
    </style>
</head>
<body>
    <div class="form-card" id="mainCard">
        <h2>Worker Application</h2>
        <form id="appForm">
            <label>FULL NAME</label>
            <input type="text" name="fullName" placeholder="John Doe" required>
            
            <label>EMAIL ADDRESS</label>
            <input type="email" name="email" placeholder="email@example.com" required>
            
            <label>PHONE NUMBER</label>
            <input type="tel" name="phone" placeholder="775-555-0123" required>
            
            <label>PRIMARY TRADE</label>
            <select name="trade" required>
                <option value="">Select Primary Trade</option>
                <option value="Carpentry">Carpentry</option>
                <option value="Plumbing">Plumbing</option>
                <option value="Electrical">Electrical</option>
                <option value="Painting">Painting</option>
                <option value="General Labor">General Labor</option>
            </select>

            <label>YEARS OF EXPERIENCE</label>
            <input type="number" name="yearsExp" placeholder="e.g. 5" min="0" required>

            <label>DO YOU HAVE YOUR OWN TOOLS?</label>
            <select name="tools" required>
                <option value="YES">Yes, I have basic tools for my trade</option>
                <option value="NO">No, I do not have tools</option>
            </select>

            <button type="submit" id="submitBtn">SUBMIT APPLICATION</button>
        </form>
    </div>

    <script>
        // UPDATED DEPLOYMENT ID: Version 134
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzgDKD-WxUrdxIPzyNOQ1Re00tZG23RHaiD0FLzs6Lv07YK916vPEMVx3ivYi9IhYKd/exec';
        const form = document.getElementById('appForm');
        
        form.addEventListener('submit', e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "PROCESSING REGISTRATION...";
            btn.disabled = true;

            const formData = new FormData(form);
            const nameParts = formData.get('fullName').trim().split(' ');
            
            const payload = {
                action: 'intake',
                firstName: nameParts[0] || "",
                lastName: nameParts.slice(1).join(' ') || "Worker",
                email: formData.get('email'),
                phone: formData.get('phone'),
                trade: formData.get('trade'),
                yearsExp: formData.get('yearsExp'),
                tools: formData.get('tools')
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            }).then(() => {
                document.getElementById('mainCard').innerHTML = `
                    <div style="text-align:center; padding: 20px;">
                        <div style="font-size: 4rem; margin-bottom:10px;">✅</div>
                        <h2 style="color: #33B26E;">Application Received</h2>
                        <p>Your profile has been logged. <strong>Check your email</strong> (including spam) for the legal agreement link.</p>
                        <a href="index.html" style="display:inline-block; margin-top:20px; color: #343E47; font-weight: bold; text-decoration: none; border-bottom: 2px solid #343E47;">Return Home</a>
                    </div>`;
            }).catch(err => {
                alert("Connection error. Please check your internet and try again.");
                btn.innerText = "SUBMIT APPLICATION";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
