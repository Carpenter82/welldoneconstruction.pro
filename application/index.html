<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application | Well Done</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; color: #343E47; }
        .form-card { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #33B26E; color: white; font-weight: bold; border: none; cursor: pointer; }
        h2 { text-align: center; color: #343E47; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Worker Application</h2>
        <form id="appForm">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="tel" name="phone" placeholder="Phone Number" required>
            <select name="trade" required>
                <option value="">Select Primary Trade</option>
                <option value="Carpentry">Carpentry</option>
                <option value="Plumbing">Plumbing</option>
                <option value="Electrical">Electrical</option>
                <option value="Painting">Painting</option>
                <option value="General Labor">General Labor</option>
            </select>
            <button type="submit" id="submitBtn">Submit Application</button>
        </form>
        <div id="responseMsg" style="display:none; text-align:center; margin-top:20px; color: #33B26E; font-weight:bold;"></div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzgDKD-WxUrdxIPzyNOQ1Re00tZG23RHaiD0FLzs6Lv07YK916vPEMVx3ivYi9IhYKd/exec';
        const form = document.getElementById('appForm');
        
        form.addEventListener('submit', e => {
            e.preventDefault();
            document.getElementById('submitBtn').innerText = "Sending...";
            
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    document.getElementById('appForm').style.display = 'none';
                    const msg = document.getElementById('responseMsg');
                    msg.style.display = 'block';
                    msg.innerText = "Application Received! We will contact you soon.";
                })
                .catch(error => console.error('Error!', error.message));
        });
    </script>
</body>
</html>
